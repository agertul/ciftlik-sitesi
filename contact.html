<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İletişim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-tr="Hoş Geldiniz" data-en="Welcome" data-ar="مرحبًا">Hoş Geldiniz</h1>
    <nav>
      <a href="index.html" data-tr="Anasayfa" data-en="Home" data-ar="الصفحة الرئيسية">Anasayfa</a>
      <a href="about.html" data-tr="Hakkımızda" data-en="About Us" data-ar="من نحن">Hakkımızda</a>
      <a href="contact.html" data-tr="İletişim" data-en="Contact" data-ar="اتصل بنا">İletişim</a>
    </nav>
    <div class="language-switch">
      <button onclick="setLanguage('tr')">TR</button>
      <button onclick="setLanguage('en')">EN</button>
      <button onclick="setLanguage('ar')">AR</button>
    </div>
  </header>

  <main>
    <h2 data-tr="Bize Ulaşın" data-en="Contact Us" data-ar="اتصل بنا">Bize Ulaşın</h2>

    <form action="https://formsubmit.co/agertul@gmail.com" method="POST" class="contact-form">
      <div>
        <label for="isim" 
          data-tr="İsim Soyisim:" 
          data-en="Full Name:" 
          data-ar="الاسم الكامل:"
        >İsim Soyisim:</label><br>
        <input type="text" id="isim" name="isim" required>
      </div>

      <div>
        <label for="email" 
          data-tr="Email:" 
          data-en="Email:" 
          data-ar="البريد الإلكتروني:"
        >Email:</label><br>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="telefon" 
          data-tr="Telefon:" 
          data-en="Phone:" 
          data-ar="الهاتف:"
        >Telefon:</label><br>
        <input type="text" id="telefon" name="telefon" required>
      </div>

      <div>
        <label for="talep" 
          data-tr="Talebiniz:" 
          data-en="Your Request:" 
          data-ar="طلبك:"
        >Talebiniz:</label><br>
        <textarea id="talep" name="talep" rows="5" required></textarea>
      </div>

     <!-- Form gönderildikten sonra yönlendirilecek sayfa -->
  <input type="hidden" name="_next" value="https://agertul.github.io/ciftlik-sitesi/tesekkurler.html">

      <button type="submit" 
        data-tr="Gönder" 
        data-en="Send" 
        data-ar="إرسال"
      >Gönder</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Tüm hakları saklıdır.</p>
  </footer>

  <script>
    function setLanguage(lang) {
      localStorage.setItem("lang", lang);
      translatePage(lang);
    }

    function translatePage(lang) {
      const elements = document.querySelectorAll("[data-" + lang + "]");
      elements.forEach(el => {
        el.textContent = el.getAttribute("data-" + lang);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("lang") || "tr";
      translatePage(savedLang);
    });
  </script>
</body>
</html>
